; BattVision ESP32-S3 Acquisition Firmware Configuration
; Target Board: PCBCupid Glyph ESP32-S3 (verify exact PlatformIO board variant before flashing)
; NOTE: Do not flash or wire to live high-current battery until board_config.h TBD values are verified.

[env:esp32s3_battvision]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DBATTVISION_SCHEMA_VERSION=\"1.0\"
    -DBATTVISION_BENCH_TEST_ONLY=1
; Add verified sensor libraries only after confirming board & circuit compatibility:
